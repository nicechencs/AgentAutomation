[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentautomation"
version = "0.1.0"
description = "Local n8n integration with a persistent Fake Agent Runner"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
  "pydantic==2.12.5",
]

[tool.setuptools.packages.find]
where = ["src"]
