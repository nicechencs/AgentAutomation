[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentautomation"
version = "0.1.0"
description = "Local n8n automation with persistent real CLI and Fake runners"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
  "pydantic==2.12.5",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
